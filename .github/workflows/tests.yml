name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, ${{ matrix.name }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix. symfony/console
      # is the only runtime dependency, so it is the axis that matters: its floor
      # is what a XenForo 2.3 add-on gets, its ceiling is what a current Laravel
      # app gets. illuminate/console is a dev dependency and rides the same rows.
      matrix:
        include:
          - { php: '8.3', name: 'Symfony ^5.4, no Laravel', laravel: '', with: 'symfony/console:^5.4', deps: '--prefer-lowest' }
          - { php: '8.3', name: 'Laravel ^12.0', laravel: '^12.0', with: 'illuminate/console:^12.0', deps: '--prefer-lowest' }
          - { php: '8.3', name: 'Laravel ^13.0', laravel: '^13.0', with: 'illuminate/console:^13.0', deps: '' }
          - { php: '8.5', name: 'Laravel ^13.0', laravel: '^13.0', with: 'illuminate/console:^13.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # The floor of the symfony/console range cannot be reached with Laravel installed:
      # illuminate/console ^12 requires symfony/console ^7, so leaving it in place pins
      # this corner to 7.x and the 5.4 floor never gets tested at all. Dropping it is
      # also the strongest statement the suite can make - the package running with no
      # Laravel anywhere on disk, which is what a XenForo add-on is.
      - if: matrix.laravel == ''
        run: composer remove --dev illuminate/console --no-update

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing. `require` would replace the constraint instead, and a
      # corner testing a version the package no longer claims would still pass.
      - run: composer update --with="${{ matrix.with }}" --prefer-dist --no-progress ${{ matrix.deps }}

      # Two of these skip themselves without illuminate/console - that is the point of
      # LaravelIntegrationTest, and `Skipped: 2` in that corner's log is the evidence.
      - run: vendor/bin/phpunit

      # Not on the Laravel-free corner: tests/ is in phpstan.neon's paths because a trait
      # is only analysed through a class that uses one, and two of those classes are the
      # Laravel ones. With illuminate/console removed PHPStan cannot resolve them and
      # reports on the absence rather than on this package. The other three corners cover
      # it, including a --prefer-lowest one, which is what catches a dependency whose own
      # version changes the result.
      - if: matrix.laravel != ''
        run: vendor/bin/phpstan analyse --no-progress

  dependencies:
    name: Declared dependencies
    runs-on: ubuntu-latest

    # Does src/ need anything that "require" does not name? Neither PHPStan run
    # answers that: both have the dev dependencies installed and see nothing
    # wrong, and the package would fatal for the consumer instead.
    #
    # symfony/console is the live risk. Its own tree brings symfony/string, the
    # polyfills and service-contracts along with it, and every class in all of
    # them resolves in a consumer install as readily as in a dev one - so an
    # undeclared Symfony\Component\String\... import would look entirely at
    # home and break nobody until Symfony reshuffles its packages. The other
    # half is illuminate/console, which is dev-only and must stay out of src/.
    #
    # Note what this cannot see: the 2.0 audit found src/ calling Symfony
    # Console while composer.json declared only illuminate/console, and no tool
    # here would have caught it - that dependency was behavioural ($this->line())
    # and referenced no symbol at all. This job covers symbols, nothing more.

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring
          coverage: none

      # The dev dependencies have to be gone: the checker judges src/ against
      # the closure a consumer actually gets, and this install is that closure.
      - run: composer install --no-dev --prefer-dist --no-progress

      # The checker is itself a dev dependency, so --no-dev just deleted it, and
      # it has to come from outside the package. composer -d does not create the
      # directory, so mkdir first or the step dies with "Invalid working
      # directory specified".
      - run: |
          mkdir -p /tmp/crc
          composer -d /tmp/crc require maglnet/composer-require-checker --no-progress

      - run: /tmp/crc/vendor/bin/composer-require-checker check composer.json

      # No dev-free PHPStan step here, unlike the sibling packages that pair one
      # with this. src/ is nothing but traits, and PHPStan does not analyse a
      # trait that no analysed class uses - so pointing it at src/ with the dev
      # dependencies gone reports "No errors" over a body it never read. Measured:
      # an Illuminate\Support\Str call planted in a trait passes, the same call
      # in a plain class in src/ is caught. The checker reads the file itself and
      # has no such blind spot, and it is the stronger check anyway - it fails on
      # a symbol that resolves but is not in "require", which PHPStan cannot.

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
