name: Tests

on:
  push:
  pull_request:
  # A dormant package still needs to hear about a new PHP release. Note that
  # GitHub disables scheduled workflows after 60 days without repository
  # activity, and emails before it does.
  schedule:
    - cron: '0 6 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: PHP ${{ matrix.php }}, Laravel ${{ matrix.laravel }} ${{ matrix.deps }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      # The corners of the supported range, not the whole matrix: the platform
      # floor with the oldest dependencies it claims, the span ceiling, and the
      # newest platform on the oldest PHP it runs on. Everything between fails
      # only when a corner does.
      matrix:
        include:
          - { php: '8.3', laravel: '^12.0', deps: '--prefer-lowest' }
          - { php: '8.3', laravel: '^13.0', deps: '' }
          - { php: '8.5', laravel: '^13.0', deps: '' }

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      # --with, not `composer require`: it constrains within the declared range and
      # refuses to go outside it, so the matrix cannot drift away from composer.json
      # without the job failing. `require` would replace the constraint instead, and a
      # corner testing a Laravel version the package no longer claims would still pass.
      - run: composer update --with="illuminate/console:${{ matrix.laravel }}" --prefer-dist --no-progress ${{ matrix.deps }}

      - run: vendor/bin/phpunit

      # Also here, not only in a job of its own: phpstan.neon covers the whole 8.3 - 8.5
      # PHP range in one pass wherever it runs, but its result still depends on the
      # dependency tree it resolved against - including phpstan's own version, which is
      # what the --prefer-lowest corner is for.
      - run: vendor/bin/phpstan analyse --no-progress

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          coverage: none

      - run: composer validate --strict

      - run: composer install --prefer-dist --no-progress

      - run: vendor/bin/pint --test
